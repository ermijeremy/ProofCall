<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CallProof{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/dashboard_extra.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/api/dashboard"><span class="brand-mark">✓</span><span>CallProof<small>Evidence monitor</small></span></a>
    <div class="nav-label">Workspace</div>
    <nav class="side-nav">
      <a href="/api/dashboard" class="nav-item"><span>▦</span>Overview</a>
      <a href="/api/dashboard/calls" class="nav-item"><span>◉</span>Live calls</a>
      <a href="/api/dashboard/calls" class="nav-item"><span>◷</span>Call activity</a>
    </nav>
    <div class="sidebar-footer"><span class="online-dot"></span>System operational</div>
  </aside>
  <section class="page-shell">
    <header class="topbar"><div><div class="eyebrow">CALLPROOF / MONITORING</div><h1>{% block page_title %}Programme overview{% endblock %}</h1></div><div class="topbar-meta"><span class="live-pill"><span class="online-dot"></span>Live workspace</span><span class="avatar">CP</span></div></header>
    <main class="content">{% block content %}{% endblock %}</main>
  </section>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
